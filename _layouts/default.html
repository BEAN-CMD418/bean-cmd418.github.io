  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Gothic+Coding&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/bean-theme.css' | relative_url }}">
  {% feed_meta %}
  {% seo %}
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Bean's Blog home">
        <span class="brand-mark"><img src="https://img.icons8.com/external-bi-chroma-amoghdesign/96/external-bean-fruits-and-vegetables-bi-chroma-amoghdesign.png" alt=""></span>
        <span>{{ site.title }}</span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url contains 'about' %}aria-current="page"{% endif %}>About Me</a>
        <a href="{{ '/categories/' | relative_url }}" {% if page.url contains 'categories' %}aria-current="page"{% endif %}>Categories</a>
      </nav>
    </div>
  </header>

  {% if page.layout == 'home' %}
  <section class="hero" aria-label="Blog introduction">
    <div class="hero-inner">
      <div class="hero-copy">
        <h1>{{ site.title }}</h1>
        <p class="hero-kicker">LEARNING · EXPLORING · DOCUMENTING</p>
        
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="hero-grid"></div>
        <div class="hero-window">
          <div class="window-top"><i></i><i></i><i></i></div>
          <div class="window-lock">
            <svg viewBox="0 0 64 72" role="presentation">
              <path d="M18 30v-9a14 14 0 0 1 28 0v9" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
              <rect x="10" y="29" width="44" height="36" rx="5" fill="none" stroke="currentColor" stroke-width="5"/>
              <circle cx="32" cy="45" r="4" fill="currentColor"/>
              <path d="M32 49v7" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
        <span class="hero-orbit orbit-one"></span>
        <span class="hero-orbit orbit-two"></span>
      </div>
    </div>
  </section>
  {% endif %}

  <main class="page-shell {% if page.layout == 'home' %}home-shell{% endif %}{% if page.category %} category-shell{% endif %}">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© {{ 'now' | date: '%Y' }} {{ site.title }}</span>
      <span>Learning · Exploring · Documenting</span>
      <span>콩 아이콘 제공: <a href="https://icons8.com/icon/xDz7yO7PvYTW/%EC%BD%A9" target="_blank" rel="noopener noreferrer">Icons8</a></span>
    </div>
  </footer>
  <script src="{{ '/assets/js/bean-theme.js' | relative_url }}" defer></script>
</body>
</html>
